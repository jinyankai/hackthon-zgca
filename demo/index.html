<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 情绪护盾 — 双向情绪防火墙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.12);
  --customer-accent: #60a5fa;
  --customer-bg: rgba(96,165,250,0.08);
  --agent-accent: #34d399;
  --agent-bg: rgba(52,211,153,0.08);
  --danger: #f87171;
  --warning: #fbbf24;
  --safe: #34d399;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --radius: 16px;
  --radius-sm: 10px;
}
body{
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-gradient);
  min-height: 100vh;
  color: var(--text);
  overflow: hidden;
}
.app-header{
  text-align:center;padding:12px 20px;
  background:rgba(0,0,0,0.3);border-bottom:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;gap:16px;
}
.app-header h1{font-size:1.3rem;font-weight:700;letter-spacing:1px}
.app-header .subtitle{font-size:0.8rem;color:var(--text-dim)}
.shield-icon{font-size:1.6rem}
.main-container{
  display:grid;grid-template-columns:1fr 1fr;
  height:calc(100vh - 56px);gap:1px;
  background:var(--glass-border);
}
.panel{
  display:flex;flex-direction:column;
  background:var(--bg-gradient);position:relative;overflow:hidden;
}
.panel-header{
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--glass-border);
  backdrop-filter:blur(10px);
}
.panel-title{font-size:0.95rem;font-weight:600;display:flex;align-items:center;gap:8px}
.panel-badge{
  font-size:0.7rem;padding:3px 8px;border-radius:20px;font-weight:500;
}
.customer-panel .panel-badge{background:rgba(96,165,250,0.2);color:var(--customer-accent)}
.agent-panel .panel-badge{background:rgba(52,211,153,0.2);color:var(--agent-accent)}
.chat-area{
  flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px}
.msg{
  max-width:85%;padding:12px 16px;border-radius:var(--radius-sm);
  font-size:0.9rem;line-height:1.5;animation:msgIn 0.3s ease;
  position:relative;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-customer{
  align-self:flex-end;background:rgba(96,165,250,0.15);
  border:1px solid rgba(96,165,250,0.25);border-bottom-right-radius:4px;
}
.msg-agent{
  align-self:flex-start;background:rgba(52,211,153,0.15);
  border:1px solid rgba(52,211,153,0.25);border-bottom-left-radius:4px;
}
.msg-system{
  align-self:center;background:var(--glass);border:1px solid var(--glass-border);
  font-size:0.8rem;color:var(--text-dim);text-align:center;
}
.msg-ai-card{
  align-self:flex-start;background:rgba(139,92,246,0.1);
  border:1px solid rgba(139,92,246,0.25);border-radius:var(--radius-sm);
  padding:14px 16px;max-width:92%;
}
.ai-card-header{
  display:flex;align-items:center;gap:6px;margin-bottom:10px;
  font-size:0.75rem;color:#a78bfa;font-weight:600;text-transform:uppercase;
  letter-spacing:0.5px;
}
.emotion-tag{
  display:inline-block;padding:2px 8px;border-radius:12px;font-size:0.72rem;font-weight:600;
}
.emotion-mild{background:rgba(52,211,153,0.2);color:var(--safe)}
.emotion-angry{background:rgba(251,191,36,0.2);color:var(--warning)}
.emotion-extreme{background:rgba(248,113,113,0.2);color:var(--danger)}
.ai-field{margin-bottom:8px}
.ai-field-label{font-size:0.72rem;color:var(--text-dim);margin-bottom:3px}
.ai-field-value{font-size:0.85rem;color:var(--text)}
.risk-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.risk-tag{
  font-size:0.7rem;padding:2px 7px;border-radius:8px;
  background:rgba(248,113,113,0.15);color:var(--danger);border:1px solid rgba(248,113,113,0.3);
}
.view-original-btn{
  font-size:0.72rem;color:#a78bfa;cursor:pointer;
  background:none;border:1px solid rgba(167,139,250,0.3);
  padding:3px 10px;border-radius:8px;margin-top:6px;
  transition:all 0.2s;
}
.view-original-btn:hover{background:rgba(167,139,250,0.15)}
.original-text{
  margin-top:8px;padding:8px 12px;background:rgba(248,113,113,0.08);
  border:1px solid rgba(248,113,113,0.2);border-radius:8px;
  font-size:0.82rem;color:var(--danger);display:none;
}
.original-text.show{display:block;animation:msgIn 0.2s ease}
.suggested-reply{
  margin-top:8px;padding:8px 12px;background:rgba(52,211,153,0.08);
  border:1px solid rgba(52,211,153,0.2);border-radius:8px;
  font-size:0.82rem;color:var(--agent-accent);cursor:pointer;
  transition:all 0.2s;
}
.suggested-reply:hover{background:rgba(52,211,153,0.15)}
.input-area{
  padding:14px 16px;border-top:1px solid var(--glass-border);
  display:flex;gap:10px;align-items:flex-end;
  backdrop-filter:blur(10px);background:rgba(0,0,0,0.2);
}
.input-area textarea{
  flex:1;background:var(--glass);border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);
  font-size:0.88rem;resize:none;height:42px;max-height:100px;
  font-family:inherit;outline:none;transition:border-color 0.2s;
}
.input-area textarea:focus{border-color:rgba(255,255,255,0.3)}
.input-area textarea::placeholder{color:var(--text-dim)}
.btn{
  padding:10px 16px;border-radius:var(--radius-sm);border:none;
  font-size:0.82rem;font-weight:600;cursor:pointer;
  transition:all 0.2s;display:flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.btn-primary{background:var(--customer-accent);color:#0f172a}
.btn-primary:hover{background:#93c5fd;transform:scale(1.02)}
.btn-success{background:var(--agent-accent);color:#0f172a}
.btn-success:hover{background:#6ee7b7;transform:scale(1.02)}
.btn-ghost{
  background:transparent;border:1px solid var(--glass-border);color:var(--text);
}
.btn-ghost:hover{background:var(--glass)}
.btn-danger{background:var(--danger);color:#0f172a}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.voice-btn{
  width:42px;height:42px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:1.1rem;
  background:var(--glass);border:1px solid var(--glass-border);
  cursor:pointer;transition:all 0.2s;color:var(--text);
}
.voice-btn.recording{
  background:rgba(248,113,113,0.3);border-color:var(--danger);
  animation:pulse 1.2s infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.4)}50%{box-shadow:0 0 0 8px rgba(248,113,113,0)}}
.energy-bar-container{
  padding:10px 20px;border-bottom:1px solid var(--glass-border);
  background:rgba(0,0,0,0.15);
}
.energy-bar-label{
  font-size:0.72rem;color:var(--text-dim);margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center;
}
.energy-bar-track{
  height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;
}
.energy-bar-fill{
  height:100%;border-radius:4px;transition:width 0.8s ease, background 0.5s ease;
}
.energy-high{background:linear-gradient(90deg,#34d399,#6ee7b7)}
.energy-mid{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.energy-low{background:linear-gradient(90deg,#f87171,#ef4444)}
.rest-reminder{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(15,12,41,0.95);border:1px solid var(--danger);
  border-radius:var(--radius);padding:32px 40px;text-align:center;
  z-index:1000;animation:msgIn 0.3s ease;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.rest-reminder h3{color:var(--danger);margin-bottom:12px;font-size:1.1rem}
.rest-reminder p{color:var(--text-dim);margin-bottom:20px;font-size:0.9rem}
.settings-modal{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.7);z-index:999;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.settings-card{
  background:#1e1b4b;border:1px solid var(--glass-border);
  border-radius:var(--radius);padding:28px 32px;width:420px;max-width:90vw;
}
.settings-card h3{margin-bottom:16px;font-size:1rem}
.settings-field{margin-bottom:14px}
.settings-field label{display:block;font-size:0.78rem;color:var(--text-dim);margin-bottom:5px}
.settings-field input,.settings-field select{
  width:100%;padding:9px 12px;background:var(--glass);
  border:1px solid var(--glass-border);border-radius:8px;
  color:var(--text);font-size:0.85rem;outline:none;
}
.settings-field input:focus,.settings-field select:focus{border-color:rgba(255,255,255,0.3)}
.settings-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.polished-card{
  background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.25);
  border-radius:var(--radius-sm);padding:12px 14px;margin-top:8px;
}
.polished-card .label{font-size:0.72rem;color:var(--agent-accent);margin-bottom:6px}
.polished-card .text{font-size:0.85rem;color:var(--text)}
.polished-actions{display:flex;gap:8px;margin-top:10px}
.typing-indicator{
  display:flex;gap:4px;align-items:center;padding:8px 14px;
  align-self:flex-start;
}
.typing-indicator span{
  width:6px;height:6px;border-radius:50%;background:var(--text-dim);
  animation:typing 1.2s infinite;
}
.typing-indicator span:nth-child(2){animation-delay:0.2s}
.typing-indicator span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.demo-controls{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(15,12,41,0.9);border:1px solid var(--glass-border);
  border-radius:var(--radius);padding:10px 20px;
  display:flex;gap:12px;align-items:center;z-index:100;
  backdrop-filter:blur(10px);
}
.settings-btn{
  position:absolute;top:12px;right:16px;background:none;border:none;
  color:var(--text-dim);cursor:pointer;font-size:1.1rem;
  transition:color 0.2s;
}
.settings-btn:hover{color:var(--text)}
</style>
</head>
<body>
<header class="app-header">
  <span class="shield-icon">&#x1F6E1;</span>
  <div>
    <h1>AI 情绪护盾</h1>
    <div class="subtitle">双向情绪防火墙 &middot; Emotion Shield Demo</div>
  </div>
  <button class="settings-btn" onclick="showSettings()">&#x2699;</button>
</header>

<div class="main-container">
  <!-- 客户视角 -->
  <div class="panel customer-panel">
    <div class="panel-header">
      <div class="panel-title">
        <span>&#x1F464;</span> 客户视角
        <span class="panel-badge">Customer View</span>
      </div>
    </div>
    <div class="chat-area" id="customerChat"></div>
    <div class="input-area">
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="语音输入">&#x1F3A4;</button>
      <textarea id="customerInput" placeholder="输入消息..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();customerSend()}"></textarea>
      <button class="btn btn-primary" onclick="customerSend()">发送</button>
    </div>
  </div>

  <!-- 服务者视角 -->
  <div class="panel agent-panel">
    <div class="panel-header">
      <div class="panel-title">
        <span>&#x1F9D1;&#x200D;&#x1F4BB;</span> 服务者视角
        <span class="panel-badge">Agent View</span>
      </div>
    </div>
    <div class="energy-bar-container">
      <div class="energy-bar-label">
        <span>情绪电量</span>
        <span id="energyValue">100%</span>
      </div>
      <div class="energy-bar-track">
        <div class="energy-bar-fill energy-high" id="energyFill" style="width:100%"></div>
      </div>
    </div>
    <div class="chat-area" id="agentChat"></div>
    <div class="input-area">
      <textarea id="agentInput" placeholder="输入回复..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();agentDraft()}"></textarea>
      <button class="btn btn-success" onclick="agentDraft()">AI优化</button>
    </div>
  </div>
</div>

<div class="demo-controls">
  <button class="btn btn-ghost" onclick="runDemo()">&#x25B6; 自动演示</button>
  <button class="btn btn-ghost" onclick="resetDemo()">&#x21BA; 重置</button>
  <span style="font-size:0.75rem;color:var(--text-dim)" id="statusText">就绪</span>
</div>
<script>
'use strict';

let config = {
  provider: localStorage.getItem('es_provider') || 'openai',
  apiKey: localStorage.getItem('es_apiKey') || '',
  model: localStorage.getItem('es_model') || 'gpt-4o',
};
let energy = 100;
let isRecording = false;
let recognition = null;
let demoRunning = false;

// --- Settings Modal ---
function showSettings() {
  const existing = document.querySelector('.settings-modal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.className = 'settings-modal';
  modal.innerHTML = `
    <div class="settings-card">
      <h3>&#x2699; API 设置</h3>
      <div class="settings-field">
        <label>API 提供商</label>
        <select id="cfgProvider">
          <option value="openai" ${config.provider==='openai'?'selected':''}>OpenAI</option>
          <option value="anthropic" ${config.provider==='anthropic'?'selected':''}>Anthropic (Claude)</option>
        </select>
      </div>
      <div class="settings-field">
        <label>API Key</label>
        <input type="password" id="cfgKey" value="${config.apiKey}" placeholder="sk-... 或 sk-ant-...">
      </div>
      <div class="settings-field">
        <label>模型</label>
        <input id="cfgModel" value="${config.model}" placeholder="gpt-4o / claude-sonnet-4-6-20250514">
      </div>
      <div class="settings-actions">
        <button class="btn btn-ghost" onclick="this.closest('.settings-modal').remove()">取消</button>
        <button class="btn btn-primary" onclick="saveSettings()">保存</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

function saveSettings() {
  config.provider = document.getElementById('cfgProvider').value;
  config.apiKey = document.getElementById('cfgKey').value;
  config.model = document.getElementById('cfgModel').value;
  localStorage.setItem('es_provider', config.provider);
  localStorage.setItem('es_apiKey', config.apiKey);
  localStorage.setItem('es_model', config.model);
  document.querySelector('.settings-modal').remove();
  setStatus('设置已保存');
}
// --- LLM API Call ---
async function callLLM(systemPrompt, userMessage) {
  if (!config.apiKey) {
    showSettings();
    throw new Error('请先设置 API Key');
  }
  if (config.provider === 'anthropic') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': config.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: config.model || 'claude-sonnet-4-6-20250514',
        max_tokens: 1024,
        system: systemPrompt,
        messages: [{ role: 'user', content: userMessage }],
      }),
    });
    if (!res.ok) throw new Error(`API Error: ${res.status}`);
    const data = await res.json();
    return data.content[0].text;
  } else {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.apiKey}`,
      },
      body: JSON.stringify({
        model: config.model || 'gpt-4o',
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userMessage },
        ],
        temperature: 0.7,
      }),
    });
    if (!res.ok) throw new Error(`API Error: ${res.status}`);
    const data = await res.json();
    return data.choices[0].message.content;
  }
}
// --- Prompts ---
const DOWNSTREAM_PROMPT = `你是一个情绪翻译引擎，保护一线服务者的心理健康。

输入：客户的原始消息（可能包含辱骂、讽刺、威胁）
输出严格JSON（不要输出其他内容）：
{
  "filtered_text": "去除攻击性后的理性版本",
  "core_request": "客户的核心诉求（一句话）",
  "emotion_level": "mild 或 angry 或 extreme",
  "emotion_score": 1到5的数字(5最严重),
  "risk_flags": ["关键词标签数组"],
  "suggested_reply": "建议服务者如何回应（一句话，专业得体）"
}

原则：
- 不隐瞒信息，只转换表达方式
- 标注情绪等级帮助服务者做心理准备
- 建议回复要专业但不卑微`;

const UPSTREAM_PROMPT = `你是一个话术优化引擎，帮助服务者把口语化回复转为专业得体的版本。

输入：服务者的原始回复
输出严格JSON（不要输出其他内容）：
{
  "polished_text": "专业得体的版本",
  "tone": "语气类型（道歉/解释/安抚/告知）",
  "changes": "简述修改了什么"
}

原则：
- 保留服务者的原意和判断
- 不过度卑微，保持平等尊重的语气
- 让回复更清晰、更有条理`;
// --- UI Helpers ---
function setStatus(text) { document.getElementById('statusText').textContent = text; }

function addMsg(chatId, html, cls = '') {
  const chat = document.getElementById(chatId);
  const div = document.createElement('div');
  div.className = `msg ${cls}`;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTyping(chatId) {
  const chat = document.getElementById(chatId);
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = chatId + '_typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping(chatId) {
  const el = document.getElementById(chatId + '_typing');
  if (el) el.remove();
}

function updateEnergy(score) {
  energy = Math.max(0, energy - score * 6);
  const fill = document.getElementById('energyFill');
  const val = document.getElementById('energyValue');
  fill.style.width = energy + '%';
  val.textContent = Math.round(energy) + '%';
  fill.className = 'energy-bar-fill ' + (energy > 60 ? 'energy-high' : energy > 30 ? 'energy-mid' : 'energy-low');
  if (energy <= 20) showRestReminder();
}

function showRestReminder() {
  if (document.querySelector('.rest-reminder')) return;
  const div = document.createElement('div');
  div.className = 'rest-reminder';
  div.innerHTML = `
    <h3>&#x26A0; 情绪电量过低</h3>
    <p>您已连续处理多个高压对话，建议休息 5 分钟</p>
    <button class="btn btn-danger" onclick="this.parentElement.remove()">我知道了</button>`;
  document.body.appendChild(div);
}
// --- Core Logic ---
async function customerSend() {
  const input = document.getElementById('customerInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  addMsg('customerChat', text, 'msg-customer');
  setStatus('AI 正在分析情绪...');
  addTyping('agentChat');

  try {
    const raw = await callLLM(DOWNSTREAM_PROMPT, text);
    removeTyping('agentChat');
    const result = JSON.parse(raw.replace(/```json?\n?/g, '').replace(/```/g, '').trim());
    renderAICard(result, text);
    updateEnergy(result.emotion_score || 2);
    setStatus('翻译完成');
  } catch (e) {
    removeTyping('agentChat');
    if (e.message.includes('API Key')) return;
    addMsg('agentChat', `<span style="color:var(--danger)">分析失败: ${e.message}</span>`, 'msg-system');
    setStatus('出错');
  }
}

function renderAICard(result, originalText) {
  const emotionCls = result.emotion_level === 'extreme' ? 'emotion-extreme' :
                     result.emotion_level === 'angry' ? 'emotion-angry' : 'emotion-mild';
  const emotionLabel = result.emotion_level === 'extreme' ? '极端' :
                       result.emotion_level === 'angry' ? '愤怒' : '轻微不满';
  const riskHtml = (result.risk_flags || []).map(f => `<span class="risk-tag">${f}</span>`).join('');
  const cardId = 'card_' + Date.now();

  const html = `
    <div class="ai-card-header">
      <span>&#x1F916;</span> AI 情绪翻译
      <span class="emotion-tag ${emotionCls}">${emotionLabel}</span>
    </div>
    <div class="ai-field">
      <div class="ai-field-label">过滤后消息</div>
      <div class="ai-field-value">${result.filtered_text}</div>
    </div>
    <div class="ai-field">
      <div class="ai-field-label">核心诉求</div>
      <div class="ai-field-value">${result.core_request}</div>
    </div>
    ${riskHtml ? `<div class="ai-field"><div class="ai-field-label">风险标签</div><div class="risk-tags">${riskHtml}</div></div>` : ''}
    <div class="suggested-reply" onclick="document.getElementById('agentInput').value=this.textContent.trim()">
      &#x1F4A1; ${result.suggested_reply}
    </div>
    <button class="view-original-btn" onclick="toggleOriginal('${cardId}')">&#x1F441; 查看原文</button>
    <div class="original-text" id="${cardId}">${originalText}</div>`;

  addMsg('agentChat', html, 'msg-ai-card');
}

function toggleOriginal(id) {
  document.getElementById(id).classList.toggle('show');
}
// --- Agent (upstream) ---
async function agentDraft() {
  const input = document.getElementById('agentInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  addMsg('agentChat', `<span style="color:var(--text-dim)">&#x270D; 我的草稿：</span> ${text}`, 'msg-agent');
  setStatus('AI 正在优化话术...');

  try {
    const raw = await callLLM(UPSTREAM_PROMPT, text);
    const result = JSON.parse(raw.replace(/```json?\n?/g, '').replace(/```/g, '').trim());
    renderPolishedCard(result, text);
    setStatus('优化完成，等待确认');
  } catch (e) {
    if (e.message.includes('API Key')) return;
    addMsg('agentChat', `<span style="color:var(--danger)">优化失败: ${e.message}</span>`, 'msg-system');
    setStatus('出错');
  }
}

function renderPolishedCard(result, originalDraft) {
  const cardDiv = document.createElement('div');
  cardDiv.className = 'msg msg-ai-card';
  cardDiv.style.maxWidth = '92%';
  cardDiv.innerHTML = `
    <div class="ai-card-header"><span>&#x2728;</span> AI 话术优化</div>
    <div class="polished-card">
      <div class="label">优化版本 (${result.tone})</div>
      <div class="text">${result.polished_text}</div>
    </div>
    <div style="font-size:0.72rem;color:var(--text-dim);margin-top:6px">修改：${result.changes}</div>
    <div class="polished-actions">
      <button class="btn btn-success" onclick="sendPolished(this, '${encodeURIComponent(result.polished_text)}')">&#x2713; 发送优化版</button>
      <button class="btn btn-ghost" onclick="sendPolished(this, '${encodeURIComponent(originalDraft)}')">发送原文</button>
    </div>`;
  document.getElementById('agentChat').appendChild(cardDiv);
  document.getElementById('agentChat').scrollTop = document.getElementById('agentChat').scrollHeight;
}

function sendPolished(btn, encodedText) {
  const text = decodeURIComponent(encodedText);
  const actions = btn.closest('.polished-actions');
  actions.innerHTML = '<span style="font-size:0.75rem;color:var(--agent-accent)">&#x2713; 已发送</span>';
  addMsg('customerChat', text, 'msg-agent');
  setStatus('消息已发送给客户');
}
// --- Voice Input ---
function toggleVoice() {
  const btn = document.getElementById('voiceBtn');
  if (isRecording) {
    isRecording = false;
    btn.classList.remove('recording');
    if (recognition) recognition.stop();
    return;
  }
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('浏览器不支持语音识别，请使用 Chrome');
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    document.getElementById('customerInput').value = transcript;
    btn.classList.remove('recording');
    isRecording = false;
  };
  recognition.onerror = () => {
    btn.classList.remove('recording');
    isRecording = false;
  };
  recognition.onend = () => {
    btn.classList.remove('recording');
    isRecording = false;
  };
  recognition.start();
  isRecording = true;
  btn.classList.add('recording');
}

// --- Auto Demo ---
const DEMO_SCRIPT = [
  { role: 'customer', text: '我的外卖呢？？？等了快一个小时了！！！你们是不是不想送了？' },
  { role: 'agent', text: '骑手堵路上了没办法', delay: 3000 },
  { role: 'customer', text: '加急个屁！退钱！你们就是骗子公司！垃圾！', delay: 5000 },
  { role: 'agent', text: '行，给你退', delay: 3000 },
  { role: 'customer', text: '你们都是废物吗？这点事都做不好？我要投诉你！', delay: 5000 },
];

async function runDemo() {
  if (demoRunning) return;
  demoRunning = true;
  resetDemo();
  setStatus('自动演示中...');

  for (const step of DEMO_SCRIPT) {
    if (!demoRunning) break;
    await sleep(step.delay || 2000);
    if (!demoRunning) break;

    if (step.role === 'customer') {
      document.getElementById('customerInput').value = step.text;
      await sleep(500);
      await customerSend();
    } else {
      await sleep(2000);
      document.getElementById('agentInput').value = step.text;
      await sleep(500);
      await agentDraft();
    }
  }
  demoRunning = false;
  setStatus('演示完成');
}

function resetDemo() {
  demoRunning = false;
  document.getElementById('customerChat').innerHTML = '';
  document.getElementById('agentChat').innerHTML = '';
  energy = 100;
  updateEnergyDisplay();
  setStatus('已重置');
}

function updateEnergyDisplay() {
  const fill = document.getElementById('energyFill');
  const val = document.getElementById('energyValue');
  fill.style.width = energy + '%';
  val.textContent = Math.round(energy) + '%';
  fill.className = 'energy-bar-fill energy-high';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// --- Init ---
if (!config.apiKey) {
  setTimeout(showSettings, 500);
}

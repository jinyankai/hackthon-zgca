<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 情绪护盾 — 双向情绪防火墙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-page: #F5F4EF;
  --bg-surface: #FFFFFF;
  --bg-subtle: #EEEDE8;
  --bg-hover: #F0EFE9;
  --bg-customer-msg: #E8E5DE;
  --bg-agent-msg: #F2F0EB;
  --border-light: #E3E2DC;
  --border-default: #D4D3CD;
  --text-primary: #1A1A1A;
  --text-secondary: #5C5C5C;
  --text-tertiary: #8C8C8C;
  --accent-orange: #D97706;
  --accent-blue: #4A7FD4;
  --accent-green: #2E8B6A;
  --accent-purple: #7C5CBF;
  --danger: #C53030;
  --danger-bg: #FEF2F2;
  --warning: #B45309;
  --warning-bg: #FFFBEB;
  --safe: #2E8B6A;
  --safe-bg: #F0FDF9;
  --radius-xl: 16px;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);
  --font-sans: 'Styrene A', 'Geist Sans', 'Noto Sans SC', -apple-system, system-ui, sans-serif;
}
body{
  font-family: var(--font-sans);
  background: var(--bg-page);
  min-height:100vh;
  color: var(--text-primary);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.app-header{
  padding:12px 24px;
  background:var(--bg-surface);
  border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;justify-content:center;gap:12px;
  position:relative;
}
.app-header h1{
  font-size:1rem;font-weight:600;color:var(--text-primary);
  letter-spacing:-0.02em;
}
.app-header .subtitle{
  font-size:0.7rem;color:var(--text-tertiary);font-weight:400;
  margin-top:1px;
}
.shield-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg, #FEF3C7, #FDE68A);
  border:1px solid #F6D860;
  display:flex;align-items:center;justify-content:center;font-size:0.95rem;
}
.main-container{
  display:grid;grid-template-columns:1fr 1fr;
  height:calc(100vh - 52px);
}
.panel{display:flex;flex-direction:column;position:relative;overflow:hidden}
.customer-panel{background:var(--bg-surface);border-right:1px solid var(--border-light)}
.agent-panel{background:var(--bg-page)}
.panel-header{
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border-light);
  background:inherit;
}
.panel-title{
  font-size:0.82rem;font-weight:500;display:flex;align-items:center;gap:8px;
  color:var(--text-secondary);
}
.panel-badge{
  font-size:0.62rem;padding:2px 8px;border-radius:10px;font-weight:500;
  letter-spacing:0.02em;
}
.customer-panel .panel-badge{
  background:#EFF6FF;color:var(--accent-blue);border:1px solid #DBEAFE;
}
.agent-panel .panel-badge{
  background:var(--safe-bg);color:var(--accent-green);border:1px solid #D1FAE5;
}
.chat-area{
  flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-track{background:transparent}
.chat-area::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:4px}
.msg{
  max-width:80%;padding:10px 14px;border-radius:var(--radius-lg);
  font-size:0.875rem;line-height:1.6;
  animation:msgFade 0.3s ease;position:relative;font-weight:400;
}
@keyframes msgFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-customer{
  align-self:flex-end;
  background:var(--bg-customer-msg);
  color:var(--text-primary);
  border-bottom-right-radius:var(--radius-sm);
}
.msg-agent{
  align-self:flex-start;
  background:var(--bg-agent-msg);
  color:var(--text-primary);
  border-bottom-left-radius:var(--radius-sm);
}
.msg-system{
  align-self:center;background:var(--bg-subtle);
  font-size:0.75rem;color:var(--text-tertiary);text-align:center;
  border-radius:var(--radius-md);padding:6px 12px;
}
.msg-ai-card{
  align-self:flex-start;
  background:var(--bg-surface);
  border:1px solid var(--border-light);
  border-radius:var(--radius-lg);
  padding:16px 18px;max-width:92%;
  box-shadow:var(--shadow-sm);
}
.ai-card-header{
  display:flex;align-items:center;gap:6px;margin-bottom:12px;
  font-size:0.68rem;color:var(--accent-purple);font-weight:600;
  text-transform:uppercase;letter-spacing:0.05em;
}
.emotion-tag{
  display:inline-flex;align-items:center;
  padding:2px 8px;border-radius:10px;font-size:0.66rem;font-weight:600;
}
.emotion-mild{background:var(--safe-bg);color:var(--safe)}
.emotion-angry{background:var(--warning-bg);color:var(--warning)}
.emotion-extreme{background:var(--danger-bg);color:var(--danger)}
.ai-field{margin-bottom:10px}
.ai-field-label{
  font-size:0.66rem;color:var(--text-tertiary);margin-bottom:3px;
  font-weight:500;letter-spacing:0.03em;
}
.ai-field-value{font-size:0.84rem;color:var(--text-primary);line-height:1.6}
.risk-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.risk-tag{
  font-size:0.64rem;padding:2px 7px;border-radius:6px;font-weight:500;
  background:var(--danger-bg);color:var(--danger);border:1px solid #FECACA;
}
.view-original-btn{
  font-size:0.7rem;color:var(--accent-purple);cursor:pointer;
  background:transparent;border:1px solid #E9E5F5;
  padding:4px 10px;border-radius:6px;margin-top:8px;
  transition:all 0.2s ease;font-weight:500;
}
.view-original-btn:hover{background:#F5F3FF;border-color:#D8D0F0}
.original-text{
  margin-top:8px;padding:10px 12px;
  background:var(--danger-bg);
  border:1px solid #FECACA;border-radius:var(--radius-md);
  font-size:0.8rem;color:var(--danger);display:none;
}
.original-text.show{display:block;animation:msgFade 0.2s ease}
.suggested-reply{
  margin-top:10px;padding:10px 12px;
  background:var(--safe-bg);
  border:1px solid #D1FAE5;border-radius:var(--radius-md);
  font-size:0.8rem;color:var(--accent-green);cursor:pointer;
  transition:all 0.2s ease;
}
.suggested-reply:hover{background:#ECFDF5;border-color:#A7F3D0}
.input-area{
  padding:14px 18px;border-top:1px solid var(--border-light);
  display:flex;gap:8px;align-items:flex-end;
  background:inherit;
}
.input-area textarea{
  flex:1;background:var(--bg-surface);
  border:1px solid var(--border-default);
  border-radius:var(--radius-lg);padding:10px 14px;color:var(--text-primary);
  font-size:0.85rem;resize:none;height:42px;max-height:100px;
  font-family:inherit;outline:none;transition:all 0.2s ease;
}
.input-area textarea:focus{
  border-color:var(--accent-blue);
  box-shadow:0 0 0 3px rgba(74,127,212,0.08);
}
.input-area textarea::placeholder{color:var(--text-tertiary)}
.agent-panel .input-area textarea{background:var(--bg-surface)}
.btn{
  padding:9px 16px;border-radius:var(--radius-md);border:none;
  font-size:0.8rem;font-weight:500;cursor:pointer;
  transition:all 0.15s ease;
  display:flex;align-items:center;gap:5px;white-space:nowrap;
  font-family:inherit;
}
.btn-primary{
  background:var(--text-primary);color:#fff;
}
.btn-primary:hover{background:#333;transform:translateY(-0.5px)}
.btn-success{
  background:var(--accent-green);color:#fff;
}
.btn-success:hover{background:#257A5C;transform:translateY(-0.5px)}
.btn-ghost{
  background:var(--bg-surface);border:1px solid var(--border-default);
  color:var(--text-secondary);
}
.btn-ghost:hover{background:var(--bg-hover);border-color:var(--border-default);color:var(--text-primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important}
.voice-btn{
  width:42px;height:42px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:0.95rem;
  background:var(--bg-surface);border:1px solid var(--border-default);
  cursor:pointer;transition:all 0.2s ease;color:var(--text-secondary);
}
.voice-btn:hover{border-color:var(--text-tertiary);color:var(--text-primary)}
.voice-btn.recording{
  background:var(--danger-bg);border-color:var(--danger);color:var(--danger);
  animation:recPulse 1.5s ease infinite;
}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(197,48,48,0.2)}50%{box-shadow:0 0 0 8px rgba(197,48,48,0)}}
.energy-bar-container{
  padding:10px 20px;border-bottom:1px solid var(--border-light);
  background:var(--bg-surface);
}
.energy-bar-label{
  font-size:0.66rem;color:var(--text-tertiary);margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center;
  font-weight:500;letter-spacing:0.02em;
}
.energy-bar-label #energyValue{font-weight:600;font-variant-numeric:tabular-nums}
.energy-bar-track{
  height:5px;background:var(--bg-subtle);border-radius:3px;overflow:hidden;
}
.energy-bar-fill{
  height:100%;border-radius:3px;
  transition:width 0.8s ease, background 0.5s ease;
}
.energy-high{background:linear-gradient(90deg,#34D399,#6EE7B7)}
.energy-mid{background:linear-gradient(90deg,#FBBF24,#F59E0B)}
.energy-low{background:linear-gradient(90deg,#F87171,#EF4444)}
.rest-reminder{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--bg-surface);
  border:1px solid var(--border-light);
  border-radius:var(--radius-xl);padding:32px 40px;text-align:center;
  z-index:1000;animation:modalPop 0.25s ease;
  box-shadow:var(--shadow-lg);
}
@keyframes modalPop{from{opacity:0;transform:translate(-50%,-50%) scale(0.95)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.rest-reminder h3{color:var(--danger);margin-bottom:8px;font-size:1rem;font-weight:600}
.rest-reminder p{color:var(--text-secondary);margin-bottom:20px;font-size:0.86rem;line-height:1.5}
.settings-modal{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);z-index:999;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.settings-card{
  background:var(--bg-surface);border:1px solid var(--border-light);
  border-radius:var(--radius-xl);padding:28px 32px;width:420px;max-width:90vw;
  box-shadow:var(--shadow-lg);
}
.settings-card h3{margin-bottom:18px;font-size:0.95rem;font-weight:600;color:var(--text-primary)}
.settings-field{margin-bottom:14px}
.settings-field label{
  display:block;font-size:0.7rem;color:var(--text-tertiary);margin-bottom:5px;
  font-weight:500;
}
.settings-field input,.settings-field select{
  width:100%;padding:9px 12px;background:var(--bg-page);
  border:1px solid var(--border-default);border-radius:var(--radius-md);
  color:var(--text-primary);font-size:0.84rem;outline:none;
  font-family:inherit;transition:all 0.15s ease;
}
.settings-field input:focus,.settings-field select:focus{
  border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(74,127,212,0.08);
}
.settings-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.polished-card{
  background:var(--safe-bg);border:1px solid #D1FAE5;
  border-radius:var(--radius-md);padding:11px 14px;margin-top:8px;
}
.polished-card .label{font-size:0.66rem;color:var(--accent-green);margin-bottom:5px;font-weight:600}
.polished-card .text{font-size:0.84rem;color:var(--text-primary);line-height:1.6}
.polished-actions{display:flex;gap:8px;margin-top:10px}
.typing-indicator{
  display:flex;gap:4px;align-items:center;padding:8px 14px;align-self:flex-start;
}
.typing-indicator span{
  width:5px;height:5px;border-radius:50%;background:var(--text-tertiary);
  animation:typeDot 1.2s ease infinite;
}
.typing-indicator span:nth-child(2){animation-delay:0.15s}
.typing-indicator span:nth-child(3){animation-delay:0.3s}
@keyframes typeDot{0%,60%,100%{opacity:0.3;transform:scale(1)}30%{opacity:1;transform:scale(1.2)}}
.demo-controls{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--bg-surface);border:1px solid var(--border-light);
  border-radius:var(--radius-lg);padding:8px 18px;
  display:flex;gap:10px;align-items:center;z-index:100;
  box-shadow:var(--shadow-md);
}
.settings-btn{
  position:absolute;top:12px;right:18px;background:none;border:none;
  color:var(--text-tertiary);cursor:pointer;font-size:0.95rem;
  transition:color 0.15s ease;padding:4px;border-radius:4px;
}
.settings-btn:hover{color:var(--text-primary)}
.status-dot{
  width:5px;height:5px;border-radius:50%;background:var(--safe);
  animation:statusBlink 2s ease infinite;
}
@keyframes statusBlink{0%,100%{opacity:1}50%{opacity:0.3}}
.sample-tray{
  padding:10px 16px;border-top:1px solid var(--border-light);
  background:var(--bg-subtle);display:none;flex-direction:column;gap:8px;
  animation:traySlide 0.3s ease;
}
.sample-tray.show{display:flex}
@keyframes traySlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sample-tray-label{
  font-size:0.65rem;color:var(--text-tertiary);font-weight:500;
  letter-spacing:0.03em;display:flex;align-items:center;gap:5px;
}
.sample-card{
  padding:10px 14px;border-radius:var(--radius-md);
  background:var(--bg-surface);border:1px solid var(--border-light);
  font-size:0.8rem;line-height:1.55;color:var(--text-primary);
  cursor:pointer;transition:all 0.2s ease;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.sample-card:hover{
  border-color:var(--accent-blue);background:#FAFBFF;
  box-shadow:0 2px 8px rgba(74,127,212,0.08);transform:translateY(-1px);
}
.agent-panel .sample-card:hover{
  border-color:var(--accent-green);background:#F6FDF9;
  box-shadow:0 2px 8px rgba(46,139,106,0.08);
}
</style>
</head>
<body>
<header class="app-header">
  <div class="shield-icon">&#x1F6E1;</div>
  <div>
    <h1>AI 情绪护盾</h1>
    <div class="subtitle">Emotion Shield &middot; 双向情绪防火墙</div>
  </div>
  <button class="settings-btn" onclick="showSettings()">&#x2699;</button>
</header>

<div class="main-container">
  <div class="panel customer-panel">
    <div class="panel-header">
      <div class="panel-title">
        &#x1F464; 客户视角
        <span class="panel-badge">Customer</span>
      </div>
    </div>
    <div class="chat-area" id="customerChat"></div>
    <div class="sample-tray" id="customerSamples">
      <div class="sample-tray-label">&#x1F3B2; 选择一条客户消息试试</div>
    </div>
    <div class="input-area">
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="语音输入">&#x1F3A4;</button>
      <textarea id="customerInput" placeholder="输入消息..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();customerSend()}"></textarea>
      <button class="btn btn-primary" onclick="customerSend()">发送</button>
    </div>
  </div>

  <div class="panel agent-panel">
    <div class="panel-header">
      <div class="panel-title">
        &#x1F9D1;&#x200D;&#x1F4BB; 服务者视角
        <span class="panel-badge">Agent</span>
      </div>
    </div>
    <div class="energy-bar-container">
      <div class="energy-bar-label">
        <span>&#x26A1; 情绪电量</span>
        <span id="energyValue">100%</span>
      </div>
      <div class="energy-bar-track">
        <div class="energy-bar-fill energy-high" id="energyFill" style="width:100%"></div>
      </div>
    </div>
    <div class="chat-area" id="agentChat"></div>
    <div class="sample-tray" id="agentSamples">
      <div class="sample-tray-label">&#x1F3B2; 选择一条服务者草稿试试</div>
    </div>
    <div class="input-area">
      <textarea id="agentInput" placeholder="输入回复..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();agentDraft()}"></textarea>
      <button class="btn btn-success" onclick="agentDraft()">AI 优化</button>
    </div>
  </div>
</div>

<div class="demo-controls">
  <div class="status-dot"></div>
  <button class="btn btn-ghost" onclick="runDemo()">&#x1F3B2; 抽取用例</button>
  <button class="btn btn-ghost" onclick="resetDemo()">&#x21BA; 重置</button>
  <span style="font-size:0.7rem;color:var(--text-tertiary);font-weight:500" id="statusText">就绪</span>
</div>
<script>
'use strict';
let config = {
  provider: localStorage.getItem('es_provider') || 'openai',
  apiKey: localStorage.getItem('es_apiKey') || 'sk-UwLfrzVuHzw8knlcFzdwpQyniX3ITpIh5siTenJ0ZjOcSEsx',
  model: localStorage.getItem('es_model') || 'gpt-5.5',
  baseUrl: localStorage.getItem('es_baseUrl') || 'https://linoapi.com.cn',
};
let energy = 100, isRecording = false, recognition = null;

function showSettings() {
  const existing = document.querySelector('.settings-modal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.className = 'settings-modal';
  modal.innerHTML = `
    <div class="settings-card">
      <h3>&#x2699; API 设置</h3>
      <div class="settings-field"><label>提供商</label>
        <select id="cfgProvider">
          <option value="deepseek" ${config.provider==='deepseek'?'selected':''}>DeepSeek</option>
          <option value="openai" ${config.provider==='openai'?'selected':''}>OpenAI</option>
          <option value="anthropic" ${config.provider==='anthropic'?'selected':''}>Anthropic</option>
        </select></div>
      <div class="settings-field"><label>API Key</label>
        <input type="password" id="cfgKey" value="${config.apiKey}" placeholder="sk-..."></div>
      <div class="settings-field"><label>模型</label>
        <input id="cfgModel" value="${config.model}" placeholder="deepseek-chat / gpt-4o"></div>
      <div class="settings-field"><label>Base URL（可选）</label>
        <input id="cfgBaseUrl" value="${config.baseUrl||''}" placeholder="留空使用默认"></div>
      <div class="settings-actions">
        <button class="btn btn-ghost" onclick="this.closest('.settings-modal').remove()">取消</button>
        <button class="btn btn-primary" onclick="saveSettings()">保存</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}
function saveSettings() {
  config.provider = document.getElementById('cfgProvider').value;
  config.apiKey = document.getElementById('cfgKey').value;
  config.model = document.getElementById('cfgModel').value;
  config.baseUrl = document.getElementById('cfgBaseUrl').value;
  localStorage.setItem('es_provider', config.provider);
  localStorage.setItem('es_apiKey', config.apiKey);
  localStorage.setItem('es_model', config.model);
  localStorage.setItem('es_baseUrl', config.baseUrl);
  document.querySelector('.settings-modal').remove();
  setStatus('已保存');
}
async function callLLM(systemPrompt, userMessage) {
  if (!config.apiKey) { showSettings(); throw new Error('请先设置 API Key'); }
  if (config.provider === 'anthropic') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':config.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:config.model||'claude-sonnet-4-6-20250514',max_tokens:1024,system:systemPrompt,messages:[{role:'user',content:userMessage}]}),
    });
    if (!res.ok) throw new Error(`API ${res.status}`);
    return (await res.json()).content[0].text;
  } else {
    let baseUrl='https://api.openai.com', defaultModel='gpt-4o';
    if (config.provider==='deepseek'){baseUrl='https://api.deepseek.com';defaultModel='deepseek-chat';}
    if (config.baseUrl) baseUrl=config.baseUrl.replace(/\/+$/,'');
    const res = await fetch(`${baseUrl}/v1/chat/completions`, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${config.apiKey}`},
      body:JSON.stringify({model:config.model||defaultModel,messages:[{role:'system',content:systemPrompt},{role:'user',content:userMessage}],temperature:0.7}),
    });
    if (!res.ok) throw new Error(`API ${res.status}`);
    return (await res.json()).choices[0].message.content;
  }
}

const DOWNSTREAM_PROMPT=`你是"AI情绪护盾"的下行翻译引擎。你的职责是保护一线服务者不被攻击性语言直接伤害，同时保留完整的业务信息和风险信号。

## 核心原则
- 降噪不是"去情绪化"，而是"去攻击性，保留情绪强度和业务风险"
- 不隐瞒任何业务事实、威胁、风险信号
- 识别反讽、阴阳怪气等隐性攻击
- 如果客户使用了人身攻击或辱骂，在输出中标注"含攻击性表达"

## 输出格式
严格输出JSON，不要输出任何其他内容：
{"filtered_text":"去除人身攻击后的版本，但必须保留情绪强度和所有业务威胁（退款、投诉、曝光等）","emotion_level":"mild或angry或extreme","emotion_score":1到5,"has_attack":true或false,"core_request_explicit":"用户嘴上明确提出的要求","core_request_implicit":"用户情绪背后真正需要的（确定性、被重视、解释、补偿等）","risk_flags":["具体风险标签：退款/投诉/辱骂/曝光/消协/差评/超时等"],"suggested_action":"服务者现在应该做的具体动作（查订单、问照片、走退款流程、升级主管等）","suggested_reply":"一句具体的、有下一步动作的回复（不要用套话）","escalation_needed":true或false}

## 示例
输入："等了四十分钟了还没到！你们配送是用爬的吗？？再不来我就退款投诉！"
输出：{"filtered_text":"客户已等待40分钟，对配送延迟非常不满，明确表示如继续延迟将申请退款并投诉","emotion_level":"angry","emotion_score":4,"has_attack":false,"core_request_explicit":"要求确认送达时间，否则退款投诉","core_request_implicit":"需要确定性和被认真对待的感觉","risk_flags":["超时","退款","投诉"],"suggested_action":"立即查询订单配送状态和骑手位置，给出预计到达时间","suggested_reply":"您已经等了40分钟，我现在帮您查骑手实时位置，马上告诉您预计几分钟到","escalation_needed":false}`;

const UPSTREAM_PROMPT=`你是"AI情绪护盾"的上行优化引擎。你的职责是帮服务者把口语化/带情绪的回复转为专业版本，同时保护服务者的边界和尊严。

## 核心原则
- 保留服务者的原意和判断，不扭曲事实
- 不过度卑微，不乞求，不无条件道歉
- 必须包含具体动作（"我现在帮您查X"），不能只有空泛安抚
- 不过度承诺（不说"一定""马上解决""请放心"，除非确实能做到）
- 承认现实和限制（系统崩了就说崩了，不能退就说条件）
- 如果服务者原文有过度自责/求饶，要移除并说明原因

## 禁止使用的套话（除非上下文确实需要）
"您好"、"感谢您的反馈"、"感谢您的理解和耐心"、"请您放心"、"我们会尽快处理"、"相关流程"、"给您带来不便深表歉意"、"我们非常重视"

## 目标风格
短句、具体、承认现实、给动作、有边界。像一个靠谱的真人同事在回复，不像客服机器人。

## 输出格式
严格输出JSON，不要输出任何其他内容：
{"polished_text":"优化后的回复（具体、有动作、不卑微、像真人）","tone":"语气类型（道歉/解释/安抚/告知/拒绝）","changes":"修改了什么","protection_note":"如有：移除了过度自责/避免了过度承诺/保留了拒绝权利等"}

## 示例
输入："退款不是我说退就退的，要走流程，你催也没用。"
输出：{"polished_text":"退款需要先确认订单状态和是否符合平台退款条件。我现在帮您查这两个信息，查到后直接告诉您能退、不能退、或者需要补充什么材料。","tone":"解释","changes":"去除对抗语气，补充具体动作和后续步骤","protection_note":"保留了服务者的判断（退款有条件），未过度承诺"}`;


function setStatus(t){document.getElementById('statusText').textContent=t}
function addMsg(chatId,html,cls=''){
  const chat=document.getElementById(chatId),div=document.createElement('div');
  div.className=`msg ${cls}`;div.innerHTML=html;
  chat.appendChild(div);chat.scrollTop=chat.scrollHeight;return div;
}
function addTyping(chatId){
  const chat=document.getElementById(chatId),div=document.createElement('div');
  div.className='typing-indicator';div.id=chatId+'_typing';
  div.innerHTML='<span></span><span></span><span></span>';
  chat.appendChild(div);chat.scrollTop=chat.scrollHeight;
}
function removeTyping(chatId){const el=document.getElementById(chatId+'_typing');if(el)el.remove()}
function updateEnergy(score){
  energy=Math.max(0,energy-score*6);
  const fill=document.getElementById('energyFill'),val=document.getElementById('energyValue');
  fill.style.width=energy+'%';val.textContent=Math.round(energy)+'%';
  fill.className='energy-bar-fill '+(energy>60?'energy-high':energy>30?'energy-mid':'energy-low');
  if(energy<=20)showRestReminder();
}
function showRestReminder(){
  if(document.querySelector('.rest-reminder'))return;
  const div=document.createElement('div');div.className='rest-reminder';
  div.innerHTML=`<h3>&#x26A0; 情绪电量过低</h3><p>您已连续处理多个高压对话，建议休息 5 分钟</p>
    <button class="btn btn-danger" onclick="this.parentElement.remove()">我知道了</button>`;
  document.body.appendChild(div);
}
async function customerSend(){
  const input=document.getElementById('customerInput'),text=input.value.trim();
  if(!text)return;input.value='';
  addMsg('customerChat',text,'msg-customer');
  setStatus('AI 分析中...');addTyping('agentChat');
  try{
    const raw=await callLLM(DOWNSTREAM_PROMPT,text);
    removeTyping('agentChat');
    const r=JSON.parse(raw.replace(/```json?\n?/g,'').replace(/```/g,'').trim());
    renderAICard(r,text);updateEnergy(r.emotion_score||2);setStatus('翻译完成');
  }catch(e){
    removeTyping('agentChat');
    if(e.message.includes('API Key'))return;
    addMsg('agentChat',`<span style="color:var(--danger)">失败: ${e.message}</span>`,'msg-system');
    setStatus('出错');
  }
}
function renderAICard(r,originalText){
  const cls=r.emotion_level==='extreme'?'emotion-extreme':r.emotion_level==='angry'?'emotion-angry':'emotion-mild';
  const label=r.emotion_level==='extreme'?'极端':r.emotion_level==='angry'?'愤怒':'轻微';
  const risk=(r.risk_flags||[]).map(f=>`<span class="risk-tag">${f}</span>`).join('');
  const id='c_'+Date.now();
  const attackWarn=r.has_attack?`<div style="font-size:0.7rem;color:var(--danger);margin-bottom:8px;font-weight:500">&#x26A0; 原文含攻击性表达，已过滤</div>`:'';
  const escalation=r.escalation_needed?`<div style="font-size:0.7rem;color:var(--danger);margin-top:8px;font-weight:500">&#x1F6A8; 建议升级主管处理</div>`:'';
  addMsg('agentChat',`
    <div class="ai-card-header"><span>&#x1F916;</span> AI 情绪翻译 <span class="emotion-tag ${cls}">${label}</span></div>
    ${attackWarn}
    <div class="ai-field"><div class="ai-field-label">过滤后消息</div><div class="ai-field-value">${r.filtered_text}</div></div>
    <div class="ai-field"><div class="ai-field-label">显性诉求</div><div class="ai-field-value">${r.core_request_explicit||r.core_request||''}</div></div>
    <div class="ai-field"><div class="ai-field-label">隐性诉求</div><div class="ai-field-value" style="color:var(--text-secondary)">${r.core_request_implicit||''}</div></div>
    ${risk?`<div class="ai-field"><div class="ai-field-label">风险标签</div><div class="risk-tags">${risk}</div></div>`:''}
    <div class="ai-field"><div class="ai-field-label">建议动作</div><div class="ai-field-value" style="font-weight:500">${r.suggested_action||''}</div></div>
    <div class="suggested-reply" onclick="document.getElementById('agentInput').value=this.textContent.trim()">&#x1F4A1; ${r.suggested_reply}</div>
    ${escalation}
    <button class="view-original-btn" onclick="toggleOriginal('${id}')">&#x1F441; 查看原文</button>
    <div class="original-text" id="${id}">${originalText}</div>`,'msg-ai-card');
}
function toggleOriginal(id){document.getElementById(id).classList.toggle('show')}

async function agentDraft(){
  const input=document.getElementById('agentInput'),text=input.value.trim();
  if(!text)return;input.value='';
  addMsg('agentChat',`<span style="color:var(--text-tertiary)">&#x270D; 草稿：</span>${text}`,'msg-agent');
  setStatus('AI 优化中...');
  try{
    const raw=await callLLM(UPSTREAM_PROMPT,text);
    const r=JSON.parse(raw.replace(/```json?\n?/g,'').replace(/```/g,'').trim());
    renderPolished(r,text);setStatus('优化完成');
  }catch(e){
    if(e.message.includes('API Key'))return;
    addMsg('agentChat',`<span style="color:var(--danger)">失败: ${e.message}</span>`,'msg-system');
    setStatus('出错');
  }
}
function renderPolished(r,draft){
  const d=document.createElement('div');d.className='msg msg-ai-card';d.style.maxWidth='92%';
  const protNote=r.protection_note?`<div style="font-size:0.68rem;color:var(--accent-green);margin-top:6px">&#x1F6E1; ${r.protection_note}</div>`:'';
  d.innerHTML=`<div class="ai-card-header"><span>&#x2728;</span> AI 话术优化</div>
    <div class="polished-card"><div class="label">优化版本 (${r.tone})</div><div class="text">${r.polished_text}</div></div>
    <div style="font-size:0.68rem;color:var(--text-tertiary);margin-top:6px">修改：${r.changes}</div>
    ${protNote}
    <div class="polished-actions">
      <button class="btn btn-success" onclick="sendFinal(this,'${encodeURIComponent(r.polished_text)}')">&#x2713; 发送优化版</button>
      <button class="btn btn-ghost" onclick="sendFinal(this,'${encodeURIComponent(draft)}')">发送原文</button>
    </div>`;
  document.getElementById('agentChat').appendChild(d);
  document.getElementById('agentChat').scrollTop=document.getElementById('agentChat').scrollHeight;
}
function sendFinal(btn,enc){
  const text=decodeURIComponent(enc);
  btn.closest('.polished-actions').innerHTML='<span style="font-size:0.72rem;color:var(--accent-green)">&#x2713; 已发送</span>';
  addMsg('customerChat',text,'msg-agent');setStatus('已发送');
}
function toggleVoice(){
  const btn=document.getElementById('voiceBtn');
  if(isRecording){isRecording=false;btn.classList.remove('recording');if(recognition)recognition.stop();return;}
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){alert('请使用 Chrome 浏览器');return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=false;
  recognition.onresult=(e)=>{document.getElementById('customerInput').value=e.results[0][0].transcript;btn.classList.remove('recording');isRecording=false;};
  recognition.onerror=()=>{btn.classList.remove('recording');isRecording=false;};
  recognition.onend=()=>{btn.classList.remove('recording');isRecording=false;};
  recognition.start();isRecording=true;btn.classList.add('recording');
}

function pickRandom(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

function runDemo() {
  const cTray = document.getElementById('customerSamples');
  const aTray = document.getElementById('agentSamples');
  const cPicks = pickRandom(CUSTOMER_SAMPLES, 2);
  const aPicks = pickRandom(AGENT_SAMPLES, 2);

  cTray.innerHTML = '<div class="sample-tray-label">&#x1F3B2; 选择一条客户消息试试</div>';
  aTray.innerHTML = '<div class="sample-tray-label">&#x1F3B2; 选择一条服务者草稿试试</div>';

  cPicks.forEach(text => {
    const card = document.createElement('div');
    card.className = 'sample-card';
    card.textContent = text;
